<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Aqua Champions 2026</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <style>
          @keyframes ballSpin {
            0%   { transform: rotate(0deg) scale(1); }
            50%  { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
          }
          @keyframes fadeInLoader { from { opacity:0; } to { opacity:1; } }
          @keyframes arcadePulse {
            0%,100% { opacity:1; text-shadow: 0 0 10px #fff, 0 0 20px #1a8fff, 0 0 40px #1a8fff; }
            50%      { opacity:0.4; text-shadow: none; }
          }
          @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
          }
          #unity-loading-bar {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex; flex-direction: column;
            align-items: center; gap: 20px;
            animation: fadeInLoader 0.4s ease;
          }
          #ball-loader {
            font-size: 4rem;
            animation: ballSpin 1.2s linear infinite;
            filter: drop-shadow(0 0 12px rgba(26,143,255,0.6));
          }
          #loader-text {
            color: #fff;
            font-family: 'Arial Black', Arial, sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: arcadePulse 1s ease-in-out infinite;
          }
          #loader-dots::after {
            content: '';
            animation: dots 1.2s steps(4, end) infinite;
          }
          #unity-progress-bar-wrap {
            width: 160px; height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px; overflow: hidden;
          }
          #unity-progress-bar-full {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #1a8fff, #00c9ff);
            border-radius: 4px;
            transition: width 0.3s ease;
          }
        </style>
        <div id="ball-loader">⚽</div>
        <div id="loader-text">Cargando<span id="loader-dots"></span></div>
        <div id="unity-progress-bar-wrap">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title"></div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var _selfUrl = window.location.href.split('?')[0];
      var buildUrl = _selfUrl.substring(0, _selfUrl.lastIndexOf('/')) + '/Build';
      var loaderUrl = buildUrl + "/05.05.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/05.05.data.unityweb",
        frameworkUrl: buildUrl + "/05.05.framework.js.unityweb",
        codeUrl: buildUrl + "/05.05.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Super Goalie Basic",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var bar = document.getElementById("unity-progress-bar-full");
          if (bar) bar.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
          window.unityInstance = unityInstance;
          try {
            if (window.parent && window.parent !== window)
              window.parent.unityInstance = unityInstance;
          } catch(e) {}
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
